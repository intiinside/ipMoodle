services:
  # Base de Datos
  db:
    image: postgres:16-alpine
    container_name: moodle_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - moodle-net

  # Aplicación (PHP-FPM)
  app:
    build: .
    container_name: moodle_app
    restart: always
    environment:
      MOODLE_DB_TYPE: pgsql
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: ${DB_NAME}
      MOODLE_DB_USER: ${DB_USER}
      MOODLE_DB_PASSWORD: ${DB_PASS}
      MOODLE_URL: ${SITE_URL}
    volumes:
      - ./html:/var/www/html
      - ./moodledata:/var/www/moodledata
    depends_on:
      - db
    networks:
      - moodle-net

  # Cron (Sidecar Container) - Ejecuta tareas cada minuto
  cron:
    build: .
    container_name: moodle_cron
    restart: always
    command: sh -c "echo '*/1 * * * * /usr/local/bin/php /var/www/html/admin/cli/cron.php > /dev/null 2>&1' > /var/spool/cron/crontabs/www-data && crond -f -l 8"
    volumes:
      - ./html:/var/www/html
      - ./moodledata:/var/www/moodledata
    depends_on:
      - app
    networks:
      - moodle-net

  # Servidor Web
  web:
    image: nginx:alpine
    container_name: moodle_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - moodle-net

networks:
  moodle-net:
    driver: bridge